name: Code quality

on:
  pull_request:
  push:
    branches:
      - main
      - blatta/main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Test BlattaCore
        run: swift test --package-path Core

      - name: Test the compatibility fixture
        run: scripts/test_compatibility_fixture.sh

      - name: Test the application
        run: xcodebuild -project Blatta.xcodeproj -scheme Blatta -configuration Debug test
