name: Code quality

on:
  pull_request:
  push:
    branches:
      - main
      - paguro/main

# One run per branch. Pushing again cancels the run it replaced rather than
# paying for both, which matters most while chasing a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: python3 -m unittest discover -s scripts -p 'test_ci_quality.py'
      - name: Detect changes that need a macOS build
        id: changes
        run: python3 scripts/ci_quality.py changes

  test:
    name: Build and test on ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # macOS 15 is the support floor and macOS 26 is where Liquid Glass runs.
      # A failure on one says nothing about the other, so let both report.
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            # Builds the real Icon Composer icon, and is where releases come from.
            appIconSetting: ""
            skipTesting: ""
          - runner: macos-15
            # macOS 15 cannot render the Icon Composer icon: actool ends with
            # "Distill failed for unknown reasons" while every test passes. This
            # job exists to run the suite on the support floor, so it skips the
            # icon rather than the tests.
            appIconSetting: "ASSETCATALOG_COMPILER_APPICON_NAME="
            # Xcode 26.3 does not accept the WKUIDelegate alert method as the
            # protocol witness, so the coordinator does not expose it and the
            # selector test fails. Skip it only on this toolchain, so the
            # test still guards every other toolchain.
            skipTesting: "-skip-testing:PaguroTests/WebRuntimeTests/testCoordinatorExposesWebUIDelegateMethods"
    steps:
      - uses: actions/checkout@v4

      # Paguro calls Liquid Glass behind an availability check, so it needs the
      # macOS 26 SDK to compile even when the deployment target is 15. The
      # macOS 15 image ships Xcode 26 but defaults to Xcode 16, whose SDK does
      # not declare those symbols at all.
      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "no Xcode 26 on this image; Liquid Glass will not compile" >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Test PaguroCore
        run: swift test --package-path Core

      - name: Test the compatibility fixture
        run: scripts/test_compatibility_fixture.sh

      - name: Test the application
        run: |
          xcodebuild -project Paguro.xcodeproj -scheme Paguro \
            -configuration Debug ${{ matrix.appIconSetting }} \
            -resultBundlePath "$RUNNER_TEMP/Paguro-${{ matrix.runner }}.xcresult" \
            ${{ matrix.skipTesting }} test

      - name: Summarize failed application tests
        if: failure()
        run: |
          results="$RUNNER_TEMP/Paguro-${{ matrix.runner }}.xcresult"
          if [ -d "$results" ]; then
            xcrun xcresulttool get test-results summary --path "$results"
          fi

      - name: Preserve failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.runner }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/Paguro-${{ matrix.runner }}.xcresult
            ~/Library/Logs/DiagnosticReports/Paguro*
            /Library/Logs/DiagnosticReports/Paguro*

  quality:
    name: Code quality
    needs: [changes, test]
    # A required result must still run when a dependency fails or is skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify required jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_quality.py verify
