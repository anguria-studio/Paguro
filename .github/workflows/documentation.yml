name: Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - paguro/main

# One run per branch. Pushing again cancels the run it replaced rather than
# paying for both, which matters most while chasing a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v3
        with:
          files: '["README.md","CONTRIBUTING.md","AGENTS.md","THIRD_PARTY_NOTICES.md","docs"]'
          fail_level: error
          filter_mode: nofilter
