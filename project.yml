name: Blatta

# XcodeGen creates the Xcode project from this file.
# Run `xcodegen generate` after each change to this file.
options:
  bundleIdPrefix: com.tommasolaterza
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Compatibility: debug
  Release: release

packages:
  BlattaCore:
    path: Core

targets:
  Blatta:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/BlattaDebug.xcconfig
      Compatibility: Configuration/BlattaDebug.xcconfig
    sources:
      - path: Blatta
        excludes:
          - "**/.DS_Store"
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: licenses
        type: folder
        buildPhase: resources
    resources:
      - path: Blatta/Resources/ServiceCatalog.json
      - path: Blatta/Resources/hagezi-light.json
      - path: Blatta/Resources/fanboy-annoyance.json
    dependencies:
      - package: BlattaCore
        product: BlattaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Blatta
        PRODUCT_NAME: Blatta
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"

        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Blatta/Blatta.entitlements

        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Blatta/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Blatta.debug
        Compatibility:
          PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Blatta.compatibility
    scheme:
      testTargets:
        - BlattaTests

  BlattaTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/BlattaDebug.xcconfig
      Compatibility: Configuration/BlattaDebug.xcconfig
    sources:
      - path: BlattaTests
    dependencies:
      - target: Blatta
      - package: BlattaCore
        product: BlattaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.BlattaTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Blatta Island Preview:
    build:
      targets:
        Blatta: all
    run:
      config: Debug
      commandLineArguments:
        "--blatta-fake-notch": true

  Blatta Compatibility:
    build:
      targets:
        Blatta: all
    run:
      config: Compatibility
      commandLineArguments:
        "--blatta-compatibility-fixture": true
    test:
      config: Debug
      targets:
        - BlattaTests
