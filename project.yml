name: Paguro

# XcodeGen creates the Xcode project from this file.
# Run `xcodegen generate` after each change to this file.
options:
  bundleIdPrefix: studio.anguria
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Compatibility: debug
  Release: release

packages:
  PaguroCore:
    path: Core

targets:
  Paguro:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/PaguroDebug.xcconfig
      Compatibility: Configuration/PaguroDebug.xcconfig
    sources:
      - path: Paguro
        excludes:
          - "**/.DS_Store"
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: licenses
        type: folder
        buildPhase: resources
    resources:
      - path: Paguro/Resources/ServiceCatalog.json
      - path: Paguro/Resources/hagezi-light.json
      - path: Paguro/Resources/fanboy-annoyance.json
    dependencies:
      - package: PaguroCore
        product: PaguroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.anguria.paguro
        PRODUCT_NAME: Paguro
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"

        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Paguro/Paguro.entitlements

        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Paguro/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: studio.anguria.paguro.debug
        Compatibility:
          PRODUCT_BUNDLE_IDENTIFIER: studio.anguria.paguro.compatibility
    scheme:
      testTargets:
        - PaguroTests

  PaguroTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/PaguroDebug.xcconfig
      Compatibility: Configuration/PaguroDebug.xcconfig
    sources:
      - path: PaguroTests
    dependencies:
      - target: Paguro
      - package: PaguroCore
        product: PaguroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.anguria.pagurotests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Paguro Island Preview:
    build:
      targets:
        Paguro: all
    run:
      config: Debug
      commandLineArguments:
        "--paguro-fake-notch": true

  Paguro Compatibility:
    build:
      targets:
        Paguro: all
    run:
      config: Compatibility
      commandLineArguments:
        "--paguro-compatibility-fixture": true
    test:
      config: Debug
      targets:
        - PaguroTests
