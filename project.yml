name: Atoll

# XcodeGen creates the Xcode project from this file.
# Run `xcodegen generate` after each change to this file.
options:
  bundleIdPrefix: com.tommasolaterza
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Compatibility: debug
  Release: release

packages:
  AtollCore:
    path: Core

targets:
  Atoll:
    type: application
    platform: macOS
    configFiles:
      Debug: Configuration/AtollDebug.xcconfig
      Compatibility: Configuration/AtollDebug.xcconfig
    sources:
      - path: Atoll
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Atoll/Resources/ServiceCatalog.json
      - path: Atoll/Resources/hagezi-light.json
      - path: Atoll/Resources/fanboy-annoyance.json
    dependencies:
      - package: AtollCore
        product: AtollCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Atoll
        PRODUCT_NAME: Atoll
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "26.0"

        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Atoll/Atoll.entitlements

        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Atoll/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_LSUIElement: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Atoll.debug
        Compatibility:
          PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.Atoll.compatibility
    scheme:
      testTargets:
        - AtollTests

  AtollTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Configuration/AtollDebug.xcconfig
      Compatibility: Configuration/AtollDebug.xcconfig
    sources:
      - path: AtollTests
    dependencies:
      - target: Atoll
      - package: AtollCore
        product: AtollCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tommasolaterza.AtollTests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Atoll Island Preview:
    build:
      targets:
        Atoll: all
    run:
      config: Debug
      commandLineArguments:
        "--atoll-fake-notch": true

  Atoll Compatibility:
    build:
      targets:
        Atoll: all
    run:
      config: Compatibility
      commandLineArguments:
        "--atoll-compatibility-fixture": true
    test:
      config: Debug
      targets:
        - AtollTests
